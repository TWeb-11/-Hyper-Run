<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Endless Runner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050816;
    touch-action:none;
}

/* =========================
   CODE SCREEN
========================= */

#codeScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#18285d 0%,#080d24 45%,#02040d 100%);
}

#codeBox{
    width:min(500px,90%);
    padding:35px 28px;
    border-radius:25px;
    text-align:center;
    background:rgba(8,15,40,.94);
    border:1px solid rgba(100,190,255,.5);
    box-shadow:
        0 0 35px rgba(0,170,255,.25),
        inset 0 0 30px rgba(30,100,255,.08);
}

#codeTitle{
    font-size:34px;
    font-weight:900;
    color:white;
    margin-bottom:15px;
    text-shadow:0 0 20px #42bfff;
}

#codeText{
    color:#b9c9ee;
    line-height:1.6;
    font-size:16px;
    margin-bottom:25px;
}

#codeInput{
    width:100%;
    padding:16px;
    border-radius:13px;
    border:1px solid #397aff;
    outline:none;
    background:#050a1c;
    color:white;
    font-size:17px;
    text-align:center;
}

#codeInput::placeholder{
    color:#69789f;
}

.codeButton{
    width:100%;
    margin-top:12px;
    padding:15px;
    border:0;
    border-radius:13px;
    color:white;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    background:linear-gradient(90deg,#2378ff,#7c3cff);
    box-shadow:0 0 20px rgba(80,100,255,.3);
}

#skipButton{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:none;
}

.codeButton:active{
    transform:scale(.98);
}

#codeError{
    min-height:24px;
    margin-top:12px;
    color:#ff657e;
    font-weight:bold;
}

/* =========================
   GAME
========================= */

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        linear-gradient(#070b20 0%,#101b3c 48%,#162343 100%);
}

/* STARS */

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    opacity:.8;
}

.s1{left:8%;top:12%}
.s2{left:18%;top:23%}
.s3{left:29%;top:9%}
.s4{left:42%;top:18%}
.s5{left:55%;top:7%}
.s6{left:67%;top:22%}
.s7{left:79%;top:11%}
.s8{left:90%;top:27%}
.s9{left:14%;top:37%}
.s10{left:72%;top:35%}

/* MOON */

#moon{
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    right:9%;
    top:8%;
    background:#e8f2ff;
    box-shadow:0 0 45px rgba(180,220,255,.5);
}

/* CITY */

#city{
    position:absolute;
    bottom:30%;
    left:0;
    width:100%;
    height:27%;
    display:flex;
    align-items:flex-end;
    gap:5px;
    overflow:hidden;
}

.building{
    flex:1;
    min-width:40px;
    background:linear-gradient(#111a39,#080d20);
    border-top:1px solid rgba(90,150,255,.3);
}

.building:nth-child(1){height:50%}
.building:nth-child(2){height:75%}
.building:nth-child(3){height:43%}
.building:nth-child(4){height:88%}
.building:nth-child(5){height:58%}
.building:nth-child(6){height:78%}
.building:nth-child(7){height:45%}
.building:nth-child(8){height:91%}
.building:nth-child(9){height:61%}
.building:nth-child(10){height:76%}
.building:nth-child(11){height:49%}
.building:nth-child(12){height:85%}

/* ROAD */

#road{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:min(900px,92%);
    height:72%;
    background:
        linear-gradient(90deg,
            #080b16 0%,
            #151a2c 50%,
            #080b16 100%);
    clip-path:polygon(31% 0,69% 0,100% 100%,0 100%);
    border-top:2px solid rgba(120,190,255,.35);
}

.laneLine{
    position:absolute;
    top:0;
    width:5px;
    height:100%;
    background:repeating-linear-gradient(
        to bottom,
        rgba(120,190,255,.7) 0px,
        rgba(120,190,255,.7) 45px,
        transparent 45px,
        transparent 85px
    );
    opacity:.55;
}

#line1{
    left:33%;
}

#line2{
    left:67%;
}

/* PLAYER */

#player{
    position:absolute;
    left:50%;
    bottom:14%;
    width:52px;
    height:95px;
    transform:translateX(-50%);
    transition:left .18s ease;
    z-index:20;
}

.head{
    position:absolute;
    top:0;
    left:13px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#e8f3ff;
    box-shadow:0 0 15px #55bfff;
}

.body{
    position:absolute;
    top:27px;
    left:14px;
    width:24px;
    height:38px;
    border-radius:9px;
    background:linear-gradient(#43baff,#514cff);
    box-shadow:0 0 18px rgba(50,150,255,.6);
}

.arm{
    position:absolute;
    top:30px;
    width:9px;
    height:34px;
    border-radius:8px;
    background:#6d86ff;
}

.arm.left{
    left:4px;
    transform:rotate(12deg);
}

.arm.right{
    right:4px;
    transform:rotate(-12deg);
}

.leg{
    position:absolute;
    top:61px;
    width:10px;
    height:34px;
    border-radius:8px;
    background:#3949a5;
}

.leg.left{
    left:13px;
    transform:rotate(4deg);
}

.leg.right{
    right:13px;
    transform:rotate(-4deg);
}

/* OBJECTS */

.object{
    position:absolute;
    z-index:15;
}

.obstacle{
    width:50px;
    height:55px;
    border-radius:9px;
    background:linear-gradient(135deg,#ff304f,#8f1635);
    border:2px solid #ff7185;
    box-shadow:
        0 0 20px rgba(255,40,80,.55),
        inset 0 0 12px rgba(255,255,255,.12);
}

.obstacle:before{
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    top:12px;
    height:6px;
    background:#ffb1bc;
    box-shadow:0 14px #ffb1bc;
    opacity:.7;
}

.coin{
    width:30px;
    height:30px;
    border-radius:50%;
    border:4px solid #ffe85a;
    background:#ffb700;
    box-shadow:
        0 0 15px #ffd42a,
        inset 0 0 8px #fff6a0;
}

/* HUD */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    z-index:50;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.hudBox{
    min-width:100px;
    padding:10px 14px;
    border-radius:12px;
    background:rgba(3,8,25,.65);
    border:1px solid rgba(110,170,255,.25);
    backdrop-filter:blur(8px);
    color:white;
    font-weight:bold;
}

.hudLabel{
    font-size:11px;
    color:#8297c5;
    text-transform:uppercase;
}

.hudValue{
    margin-top:3px;
    font-size:19px;
}

/* TOUCH */

#touch{
    position:absolute;
    z-index:100;
    left:0;
    right:0;
    bottom:25px;
    display:none;
    justify-content:space-between;
    padding:0 35px;
    pointer-events:none;
}

.touchButton{
    width:90px;
    height:90px;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:36px;
    font-weight:bold;
    color:white;
    background:rgba(30,60,140,.75);
    border:2px solid rgba(120,190,255,.5);
    box-shadow:0 0 20px rgba(50,130,255,.3);
    pointer-events:auto;
}

.touchButton:active{
    transform:scale(.93);
    background:rgba(60,100,220,.9);
}

/* MENU */

#menu{
    position:absolute;
    inset:0;
    z-index:200;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(2,5,18,.48);
    backdrop-filter:blur(5px);
}

.menuBox{
    width:min(520px,90%);
    padding:35px;
    text-align:center;
    border-radius:25px;
    background:rgba(6,12,32,.9);
    border:1px solid rgba(100,180,255,.35);
    box-shadow:0 0 45px rgba(20,80,255,.2);
}

.subtitle{
    color:#67c9ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:4px;
    margin-bottom:18px;
}

#menuText{
    color:#c7d5f5;
    line-height:1.8;
    margin-bottom:25px;
}

.startButton{
    width:100%;
    padding:17px;
    border:0;
    border-radius:14px;
    background:linear-gradient(90deg,#168bff,#713cff);
    color:white;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 0 25px rgba(50,100,255,.35);
}

.startButton:active{
    transform:scale(.98);
}

/* RESPONSIVE */

@media(max-width:1024px){

    #touch{
        display:flex;
    }

    #road{
        width:95%;
    }
}

@media(max-width:600px){

    #codeBox{
        padding:27px 20px;
    }

    #codeTitle{
        font-size:28px;
    }

    .touchButton{
        width:76px;
        height:76px;
        font-size:30px;
        border-radius:20px;
    }

    #touch{
        padding:0 18px;
        bottom:18px;
    }

    .hudBox{
        min-width:80px;
        padding:8px 10px;
    }

    .hudValue{
        font-size:16px;
    }
}

@media(max-width:380px){

    .touchButton{
        width:66px;
        height:66px;
        font-size:25px;
    }

    #touch{
        padding:0 12px;
    }

    .hudBox{
        min-width:70px;
    }
}

@media(min-width:601px) and (max-width:1024px){

    #touch{
        padding:0 45px;
        bottom:30px;
    }

    .touchButton{
        width:105px;
        height:105px;
        font-size:42px;
    }
}
</style>
</head>

<body>

<!-- CODE SCREEN -->

<div id="codeScreen">

    <div id="codeBox">

        <div id="codeTitle">🔐 Zugang</div>

        <div id="codeText">
            Du kannst einen Zugangscode eingeben.<br>
            Mit dem richtigen Code kannst du Hindernisse berühren,<br>
            ohne eliminiert zu werden.
        </div>

        <input
            id="codeInput"
            type="text"
            placeholder="Code eingeben"
            autocomplete="off"
            spellcheck="false"
        >

        <button class="codeButton" id="codeButton">
            WEITER
        </button>

        <button class="codeButton" id="skipButton">
            ÜBERSPRINGEN
        </button>

        <div id="codeError"></div>

    </div>

</div>


<!-- GAME -->

<div id="game">

    <!-- STARS -->
    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="star s6"></div>
    <div class="star s7"></div>
    <div class="star s8"></div>
    <div class="star s9"></div>
    <div class="star s10"></div>

    <div id="moon"></div>

    <!-- CITY -->
    <div id="city">
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
    </div>

    <!-- ROAD -->
    <div id="road">
        <div class="laneLine" id="line1"></div>
        <div class="laneLine" id="line2"></div>
    </div>

    <!-- PLAYER -->
    <div id="player">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
    </div>

    <!-- HUD -->
    <div id="hud">

        <div class="hudBox">
            <div class="hudLabel">Punkte</div>
            <div class="hudValue" id="score">0</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">Münzen</div>
            <div class="hudValue" id="coins">0</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">Level</div>
            <div class="hudValue" id="difficulty">1</div>
        </div>

    </div>

    <!-- TOUCH -->
    <div id="touch">

        <div class="touchButton" id="left">◀</div>
        <div class="touchButton" id="right">▶</div>

    </div>

    <!-- MENU -->
    <div id="menu">

        <div class="menuBox">

            <div class="subtitle">
                ENDLESS RUN
            </div>

            <div id="menuText">
                🏃 Laufe so weit du kannst!<br>
                🪙 Sammle Münzen!<br>
                🚧 Weiche Hindernissen aus!<br>
                ⚡ Die Geschwindigkeit steigt langsam!
            </div>

            <button class="startButton" id="start">
                SPIEL STARTEN
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   CODE
========================= */

const SECRET_CODE = "WelcomeT13";

let codeUnlocked = false;

const codeScreen = document.getElementById("codeScreen");
const codeInput = document.getElementById("codeInput");
const codeButton = document.getElementById("codeButton");
const skipButton = document.getElementById("skipButton");
const codeError = document.getElementById("codeError");


function checkCode(){

    const enteredCode =
        codeInput.value.trim();

    if(enteredCode === SECRET_CODE){

        codeUnlocked = true;

        codeScreen.style.display = "none";

        codeError.textContent = "";

        codeInput.value = "";

    }else{

        codeError.textContent =
            "❌ Falscher Code";

        codeInput.value = "";

        codeInput.focus();

    }

}


/* =========================
   ÜBERSPRINGEN
========================= */

skipButton.addEventListener("click",function(){

    codeUnlocked = false;

    codeScreen.style.display = "none";

});


codeButton.addEventListener(
    "click",
    checkCode
);


codeInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            checkCode();
        }

    }
);


/* =========================
   GAME VARIABLES
========================= */

const player =
    document.getElementById("player");

const scoreDisplay =
    document.getElementById("score");

const coinsDisplay =
    document.getElementById("coins");

const difficultyDisplay =
    document.getElementById("difficulty");

const menu =
    document.getElementById("menu");

const menuText =
    document.getElementById("menuText");

const startButton =
    document.getElementById("start");


let running = false;

let lane = 1;

let score = 0;

let coins = 0;


/*
   Sehr langsamer Start.
   Die Geschwindigkeit steigt
   nur ganz langsam.
*/

let speed = 4.5;

let difficulty = 1;

let spawnTimer = 0;

let objects = [];

let lastTime = 0;

let highscore =
    Number(
        localStorage.getItem(
            "runnerHighscore"
        ) || 0
    );


/* =========================
   LANES
========================= */

const lanes = [
    35,
    50,
    65
];


function updatePlayer(){

    player.style.left =
        lanes[lane] + "%";

}


/* =========================
   START
========================= */

function startGame(){

    running = true;

    lane = 1;

    score = 0;

    coins = 0;

    speed = 4.5;

    difficulty = 1;

    spawnTimer = 0;

    lastTime =
        performance.now();


    objects.forEach(function(obj){

        obj.element.remove();

    });

    objects = [];


    scoreDisplay.textContent = "0";

    coinsDisplay.textContent = "0";

    difficultyDisplay.textContent = "1";


    menu.style.display = "none";


    updatePlayer();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   SPAWN
========================= */

function spawnObject(){

    const element =
        document.createElement("div");


    /*
      Hindernisse bleiben am Anfang
      etwas seltener.
    */

    const obstacleChance =
        Math.min(
            0.76,
            0.50 + difficulty * 0.012
        );


    const isObstacle =
        Math.random() <
        obstacleChance;


    const randomLane =
        Math.floor(
            Math.random() * 3
        );


    element.classList.add("object");


    if(isObstacle){

        element.classList.add(
            "obstacle"
        );

    }else{

        element.classList.add(
            "coin"
        );

    }


    element.style.left =
        lanes[randomLane] + "%";


    element.style.top =
        "-80px";


    document
        .getElementById("game")
        .appendChild(element);


    objects.push({

        element:element,

        lane:randomLane,

        type:
            isObstacle
            ? "obstacle"
            : "coin",

        y:-80

    });

}


/* =========================
   COLLISION
========================= */

function checkCollision(element){

    const playerRect =
        player.getBoundingClientRect();

    const objectRect =
        element.getBoundingClientRect();


    return !(
        playerRect.right <
        objectRect.left ||

        playerRect.left >
        objectRect.right ||

        playerRect.bottom <
        objectRect.top ||

        playerRect.top >
        objectRect.bottom
    );

}


/* =========================
   OBJECTS
========================= */

function moveObjects(delta){

    for(
        let i=objects.length-1;
        i>=0;
        i--
    ){

        const obj =
            objects[i];


        obj.y +=
            speed *
            delta *
            0.08;


        obj.element.style.top =
            obj.y + "px";


        /* COIN */

        if(
            obj.type === "coin" &&
            obj.lane === lane &&
            checkCollision(
                obj.element
            )
        ){

            coins++;

            score += 50;


            obj.element.remove();

            objects.splice(i,1);

            continue;

        }


        /* OBSTACLE */

        if(
            obj.type === "obstacle" &&
            obj.lane === lane &&
            checkCollision(
                obj.element
            )
        ){

            /*
              Mit Zugangscode:
              Kein Game Over.
            */

            if(codeUnlocked){

                continue;

            }


            /*
              Ohne Code:
              Normales Spiel.
            */

            gameOver();

            return;

        }


        /* ENTFERNEN */

        if(
            obj.y >
            window.innerHeight + 100
        ){

            obj.element.remove();

            objects.splice(i,1);

        }

    }

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(timestamp){

    if(!running){
        return;
    }


    const delta =
        Math.min(
            40,
            timestamp - lastTime
        );


    lastTime = timestamp;


    /*
      Punkte steigen langsam.
    */

    score +=
        0.055 *
        speed *
        delta;


    /*
      Neues Level erst alle
      500 Punkte.
    */

    difficulty =
        Math.floor(
            score / 500
        ) + 1;


    /*
      SEHR langsame
      Geschwindigkeitssteigerung.
    */

    speed =
        4.5 +
        (difficulty - 1) *
        0.25;


    /*
      Hindernisse kommen
      nur langsam häufiger.
    */

    spawnTimer += delta;


    const spawnInterval =
        Math.max(
            750,
            1250 -
            difficulty * 10
        );


    if(
        spawnTimer >=
        spawnInterval
    ){

        spawnObject();

        spawnTimer = 0;

    }


    moveObjects(delta);


    scoreDisplay.textContent =
        Math.floor(score);


    coinsDisplay.textContent =
        coins;


    difficultyDisplay.textContent =
        difficulty;


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running = false;


    if(score > highscore){

        highscore =
            Math.floor(score);


        localStorage.setItem(
            "runnerHighscore",
            highscore
        );

    }


    menuText.innerHTML =
        "💥 Runde beendet!<br><br>" +

        "🏆 Punkte: " +
        Math.floor(score) +

        "<br>🪙 Münzen: " +
        coins +

        "<br>⭐ Highscore: " +
        highscore +

        "<br>⚡ Level: " +
        difficulty;


    startButton.textContent =
        "NOCHMAL SPIELEN";


    menu.style.display =
        "flex";

}


/* =========================
   LINKS / RECHTS
========================= */

function moveLeft(){

    if(!running){
        return;
    }


    if(lane > 0){

        lane--;

        updatePlayer();

    }

}


function moveRight(){

    if(!running){
        return;
    }


    if(lane < 2){

        lane++;

        updatePlayer();

    }

}


/* =========================
   TASTATUR
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            moveLeft();

        }


        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            moveRight();

        }

    }
);


/* =========================
   TOUCH
========================= */

document
    .getElementById("left")
    .addEventListener(
        "pointerdown",
        function(event){

            event.preventDefault();

            moveLeft();

        }
    );


document
    .getElementById("right")
    .addEventListener(
        "pointerdown",
        function(event){

            event.preventDefault();

            moveRight();

        }
    );


/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
    "click",
    startGame
);


/* =========================
   INITIAL POSITION
========================= */

updatePlayer();

</script>

</body>
</html>
