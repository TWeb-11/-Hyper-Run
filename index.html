<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TWEB-11</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#02040c;
    color:white;
}

body{
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 15%,
            #3459a5 0%,
            #151f43 35%,
            #060a18 72%,
            #010207 100%
        );
}

/* =========================
   HINTERGRUND
========================= */

.stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 2px),
        radial-gradient(circle,#62eaff 1px,transparent 2px),
        radial-gradient(circle,#a987ff 1px,transparent 2px);

    background-size:
        80px 80px,
        135px 135px,
        190px 190px;

    opacity:.55;

    animation:stars 12s linear infinite;
}

@keyframes stars{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(120px);
    }
}

.moon{
    position:absolute;

    width:110px;
    height:110px;

    right:8%;
    top:8%;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #d9f9ff 55%,
            #8edfff
        );

    box-shadow:
        0 0 25px #8beaff,
        0 0 70px rgba(60,220,255,.55);
}

/* =========================
   STADT
========================= */

.city{
    position:absolute;
    bottom:27%;
    width:100%;
    height:28%;
}

.building{
    position:absolute;
    bottom:0;

    width:9%;
    min-width:55px;

    background:
        linear-gradient(
            180deg,
            #172d55,
            #070d1c
        );

    border:1px solid rgba(80,200,255,.5);
}

.building:after{
    content:"";

    position:absolute;
    inset:7px;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(80,225,255,.65) 0 4px,
            transparent 4px 17px
        );

    opacity:.45;
}

.b1{left:1%;height:80%}
.b2{left:12%;height:60%}
.b3{left:23%;height:100%}
.b4{left:34%;height:55%}
.b5{right:1%;height:90%}
.b6{right:12%;height:65%}
.b7{right:23%;height:80%}
.b8{right:34%;height:50%}

/* =========================
   STRASSE
========================= */

#road{
    position:absolute;

    left:50%;
    bottom:-5%;

    transform:translateX(-50%);

    width:85%;
    height:80%;

    background:
        linear-gradient(
            90deg,
            #070c18,
            #293950,
            #070c18
        );

    clip-path:
        polygon(
            36% 0,
            64% 0,
            100% 100%,
            0 100%
        );

    border-left:3px solid #35ddff;
    border-right:3px solid #35ddff;

    box-shadow:
        0 0 50px rgba(0,210,255,.15);
}

.lane{
    position:absolute;

    width:5px;
    height:100%;

    background:
        repeating-linear-gradient(
            to bottom,
            #64eaff 0 55px,
            transparent 55px 115px
        );

    animation:
        roadmove .5s linear infinite;

    opacity:.65;
}

.lane1{
    left:41%;
}

.lane2{
    left:59%;
}

@keyframes roadmove{
    from{
        background-position:0 0;
    }

    to{
        background-position:0 115px;
    }
}

/* =========================
   SPIELER
========================= */

#player{
    position:absolute;

    width:62px;
    height:95px;

    left:50%;
    bottom:14%;

    transform:translateX(-50%);

    z-index:50;

    transition:left .12s ease;

    filter:
        drop-shadow(
            0 0 10px
            rgba(0,230,255,.55)
        );
}

.head{
    position:absolute;

    width:31px;
    height:31px;

    left:15px;
    top:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ffe2bd,
            #ffbd7a
        );

    border:2px solid #111;
}

.body{
    position:absolute;

    width:42px;
    height:47px;

    left:10px;
    top:27px;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #4054ff
        );

    box-shadow:
        0 0 15px #00dfff;
}

.arm{
    position:absolute;

    width:9px;
    height:35px;

    top:32px;

    border-radius:8px;

    background:#ffca96;
}

.arm.left{
    left:2px;
    transform:rotate(18deg);
}

.arm.right{
    right:2px;
    transform:rotate(-18deg);
}

.leg{
    position:absolute;

    width:12px;
    height:32px;

    top:70px;

    border-radius:7px;

    background:#252d48;
}

.leg.left{
    left:13px;
    transform:rotate(12deg);
}

.leg.right{
    right:13px;
    transform:rotate(-12deg);
}

/* =========================
   MÜNZEN
========================= */

.coin{
    position:absolute;

    width:32px;
    height:32px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fffbd0 0 15%,
            #ffe02d 20% 62%,
            #ff9d00 65%
        );

    border:2px solid #fff09a;

    box-shadow:
        0 0 12px #ffd21c,
        0 0 28px rgba(255,195,0,.8);

    z-index:35;

    animation:coinSpin .7s linear infinite;
}

@keyframes coinSpin{
    0%{
        transform:
            translateX(-50%)
            rotateY(0);
    }

    50%{
        transform:
            translateX(-50%)
            rotateY(180deg);
    }

    100%{
        transform:
            translateX(-50%)
            rotateY(360deg);
    }
}

/* =========================
   HINDERNISSE
========================= */

.obstacle{
    position:absolute;

    width:60px;
    height:58px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff416c,
            #9e0b3b
        );

    border:2px solid #ff9eb4;

    box-shadow:
        0 0 20px
        rgba(255,40,100,.75);

    z-index:34;
}

.obstacle:before{
    content:"!";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-55%);

    font-size:35px;
    font-weight:bold;

    text-shadow:
        0 0 10px #ff003c;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;

    top:18px;
    left:18px;
    right:18px;

    display:flex;
    justify-content:space-between;

    gap:10px;

    z-index:100;
}

.box{
    min-width:105px;

    padding:10px 15px;

    border-radius:15px;

    background:
        rgba(3,8,24,.75);

    border:
        1px solid
        rgba(80,225,255,.8);

    box-shadow:
        0 0 18px
        rgba(0,200,255,.2);

    backdrop-filter:blur(8px);

    font-weight:bold;
    text-align:center;
}

#score{
    color:#6eeaff;
}

#coins{
    color:#ffe35c;
}

#difficulty{
    color:#ff70b1;
}

/* =========================
   TOUCH STEUERUNG
========================= */

#touch{
    position:absolute;

    left:0;
    right:0;

    bottom:25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:
        0
        28px
        max(20px,env(safe-area-inset-bottom));

    z-index:150;

    pointer-events:none;
}

.touchButton{
    width:92px;
    height:92px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    border:
        3px solid
        rgba(100,235,255,.9);

    background:
        linear-gradient(
            145deg,
            rgba(20,55,95,.96),
            rgba(5,15,35,.96)
        );

    color:white;

    font-size:40px;

    font-weight:bold;

    box-shadow:
        0 0 25px
        rgba(0,210,255,.4),

        inset 0 0 18px
        rgba(0,220,255,.12);

    backdrop-filter:blur(10px);

    pointer-events:auto;

    touch-action:manipulation;

    transition:
        transform .08s ease,
        box-shadow .08s ease;
}

.touchButton:active{
    transform:scale(.87);

    box-shadow:
        0 0 40px
        rgba(0,230,255,.8);
}

/* =========================
   START MENÜ
========================= */

#menu{
    position:absolute;

    inset:0;

    z-index:200;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        rgba(1,4,13,.8);

    backdrop-filter:blur(12px);
}

.menuBox{
    width:min(92%,540px);

    padding:42px 30px;

    text-align:center;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(15,28,65,.98),
            rgba(5,10,25,.98)
        );

    border:
        1px solid
        rgba(70,225,255,.85);

    box-shadow:
        0 0 40px
        rgba(0,210,255,.35);
}

.title{
    font-size:clamp(48px,11vw,82px);

    letter-spacing:7px;

    color:#67eaff;

    text-shadow:
        0 0 12px #00cfff,
        0 0 30px
        rgba(0,210,255,.7);

    margin-bottom:8px;
}

.subtitle{
    font-size:14px;

    letter-spacing:5px;

    color:#8da8cb;

    margin-bottom:22px;
}

.text{
    color:#c9d7ee;

    line-height:1.7;

    margin-bottom:30px;
}

.startButton{
    width:100%;

    border:none;

    border-radius:16px;

    padding:18px 30px;

    background:
        linear-gradient(
            135deg,
            #62efff,
            #4c8dff
        );

    color:#031019;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 25px
        rgba(0,220,255,.45);
}

.startButton:active{
    transform:scale(.97);
}

.hidden{
    display:none!important;
}

/* =========================
   HANDY + TABLET
========================= */

@media(max-width:1024px){

    #touch{
        display:flex;
    }

    #road{
        width:95%;
    }

    .touchButton{
        width:88px;
        height:88px;
    }
}

/* =========================
   HANDY
========================= */

@media(max-width:600px){

    #hud{
        top:10px;
        left:10px;
        right:10px;

        gap:6px;
    }

    .box{
        min-width:0;

        padding:8px 10px;

        font-size:12px;

        border-radius:11px;
    }

    .moon{
        width:75px;
        height:75px;
    }

    .menuBox{
        padding:30px 20px;
    }

    .title{
        font-size:clamp(42px,14vw,65px);

        letter-spacing:4px;
    }

    .subtitle{
        font-size:10px;
    }

    .text{
        font-size:14px;
    }

    #touch{
        bottom:15px;

        padding-left:18px;
        padding-right:18px;
    }

    .touchButton{
        width:74px;
        height:74px;

        font-size:32px;

        border-radius:22px;
    }
}

/* =========================
   KLEINES HANDY
========================= */

@media(max-width:380px){

    .touchButton{
        width:65px;
        height:65px;

        font-size:28px;
    }

    #touch{
        bottom:10px;
    }

    .box{
        font-size:10px;
    }
}

/* =========================
   TABLET
========================= */

@media(min-width:601px) and (max-width:1024px){

    #touch{
        bottom:30px;

        padding-left:45px;
        padding-right:45px;
    }

    .touchButton{
        width:100px;
        height:100px;

        font-size:44px;
    }

    .box{
        font-size:15px;

        padding:12px 18px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="stars"></div>

    <div class="moon"></div>

    <div class="city">

        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>
        <div class="building b6"></div>
        <div class="building b7"></div>
        <div class="building b8"></div>

    </div>

    <div id="road">

        <div class="lane lane1"></div>
        <div class="lane lane2"></div>

    </div>

    <!-- SPIELER -->

    <div id="player">

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>

    <!-- HUD -->

    <div id="hud">

        <div class="box">
            🏆 <span id="score">0</span>
        </div>

        <div class="box">
            🪙 <span id="coins">0</span>
        </div>

        <div class="box">
            ⚡ <span id="difficulty">1</span>
        </div>

    </div>

    <!-- NUR LINKS + RECHTS -->

    <div id="touch">

        <div
            class="touchButton"
            id="left">
            ◀
        </div>

        <div
            class="touchButton"
            id="right">
            ▶
        </div>

    </div>

    <!-- MENÜ -->

    <div id="menu">

        <div class="menuBox">

            <div class="title">
                TWEB-11
            </div>

            <div class="subtitle">
                ENDLESS RUN
            </div>

            <div
                class="text"
                id="menuText">

                🏃 Laufe so weit du kannst!<br>
                🪙 Sammle Münzen!<br>
                🚧 Weiche Hindernissen aus!<br>
                ⚡ Die Geschwindigkeit steigt!

            </div>

            <button
                class="startButton"
                id="start">

                SPIEL STARTEN

            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   ELEMENTE
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const coinText =
    document.getElementById("coins");

const difficultyText =
    document.getElementById("difficulty");

const menu =
    document.getElementById("menu");

const menuText =
    document.getElementById("menuText");

const startButton =
    document.getElementById("start");


/* =========================
   VARIABLEN
========================= */

let running = false;

let lane = 1;

let score = 0;

let coins = 0;

let speed = 5;

let difficulty = 1;

let spawnTimer = 0;

let objects = [];

let lastTime = 0;

let highscore =
    Number(
        localStorage.getItem(
            "tweb11Highscore"
        ) || 0
    );


const lanes = [
    35,
    50,
    65
];


/* =========================
   SPIELER
========================= */

function updatePlayer(){

    player.style.left =
        lanes[lane] + "%";

}


/* =========================
   SPIEL STARTEN
========================= */

function startGame(){

    objects.forEach(
        object => object.el.remove()
    );

    objects = [];

    running = true;

    lane = 1;

    score = 0;

    coins = 0;

    speed = 5;

    difficulty = 1;

    spawnTimer = 20;

    scoreText.textContent = "0";

    coinText.textContent = "0";

    difficultyText.textContent = "1";

    updatePlayer();

    menu.classList.add("hidden");

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

    if(!running)
        return;

    const delta =
        Math.min(
            (time-lastTime)/16.67,
            3
        );

    lastTime = time;


    /* SCORE */

    score +=
        0.08 *
        speed *
        delta;


    /* SCHWIERIGKEIT */

    const newDifficulty =
        Math.floor(
            score / 250
        ) + 1;


    if(
        newDifficulty !==
        difficulty
    ){

        difficulty =
            newDifficulty;

        difficultyText.textContent =
            difficulty;
    }


    /* GESCHWINDIGKEIT */

    speed =
        5 +
        (difficulty-1)*0.8;


    /* HINDERNISSE */

    spawnTimer -= delta;


    if(spawnTimer <= 0){

        spawnObject();


        const minimum =
            Math.max(
                20,
                34-difficulty
            );


        const maximum =
            Math.max(
                minimum,
                70-difficulty*4
            );


        spawnTimer =
            minimum +
            Math.random() *
            (maximum-minimum);

    }


    moveObjects(delta);


    scoreText.textContent =
        Math.floor(score);


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   OBJEKT ERSTELLEN
========================= */

function spawnObject(){

    const obstacleChance =
        Math.min(
            .82,
            .55 +
            difficulty*.025
        );


    const isCoin =
        Math.random() >
        obstacleChance;


    const element =
        document.createElement("div");


    element.className =
        isCoin
        ? "coin"
        : "obstacle";


    const randomLane =
        Math.floor(
            Math.random()*3
        );


    element.style.left =
        lanes[randomLane] + "%";


    element.style.transform =
        "translateX(-50%)";


    element.style.top =
        "-90px";


    game.appendChild(element);


    objects.push({

        el:element,

        y:-90,

        lane:randomLane,

        coin:isCoin

    });

}


/* =========================
   OBJEKTE BEWEGEN
========================= */

function moveObjects(delta){

    for(
        let i=objects.length-1;
        i>=0;
        i--
    ){

        const object =
            objects[i];


        object.y +=
            speed * delta;


        object.el.style.top =
            object.y + "px";


        if(
            checkCollision(object)
        ){

            /* MÜNZE */

            if(object.coin){

                coins++;

                score += 50;

                coinText.textContent =
                    coins;

                object.el.remove();

                objects.splice(i,1);

                continue;
            }


            /* HINDERNIS */

            gameOver();

            return;
        }


        if(
            object.y >
            window.innerHeight + 100
        ){

            object.el.remove();

            objects.splice(i,1);

        }

    }

}


/* =========================
   KOLLISION
========================= */

function checkCollision(object){

    if(
        object.lane !== lane
    )
        return false;


    const p =
        player.getBoundingClientRect();


    const o =
        object.el.getBoundingClientRect();


    const padding = 9;


    return(

        p.left + padding <
        o.right - padding

        &&

        p.right - padding >
        o.left + padding

        &&

        p.top + padding <
        o.bottom - padding

        &&

        p.bottom - padding >
        o.top + padding

    );

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running = false;


    const finalScore =
        Math.floor(score);


    if(
        finalScore >
        highscore
    ){

        highscore =
            finalScore;


        localStorage.setItem(
            "tweb11Highscore",
            highscore
        );

    }


    menuText.innerHTML =

        "💥 <b>GAME OVER</b> 💥<br><br>" +

        "🏆 Score: <b>" +
        finalScore +
        "</b><br>" +

        "🪙 Münzen: <b>" +
        coins +
        "</b><br>" +

        "🏅 Highscore: <b>" +
        highscore +
        "</b><br><br>" +

        "⚡ Schwierigkeit: <b>" +
        difficulty +
        "</b>";


    startButton.textContent =
        "NOCHMAL SPIELEN";


    menu.classList.remove(
        "hidden"
    );

}


/* =========================
   NUR LINKS
========================= */

function moveLeft(){

    if(!running)
        return;


    if(lane > 0){

        lane--;

        updatePlayer();

    }

}


/* =========================
   NUR RECHTS
========================= */

function moveRight(){

    if(!running)
        return;


    if(lane < 2){

        lane++;

        updatePlayer();

    }

}


/* =========================
   PC STEUERUNG
========================= */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ){

            moveLeft();

        }


        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ){

            moveRight();

        }

    }
);


/* =========================
   TOUCH LINKS
========================= */

document
    .getElementById("left")
    .addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            moveLeft();

        }
    );


/* =========================
   TOUCH RECHTS
========================= */

document
    .getElementById("right")
    .addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            moveRight();

        }
    );


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    startGame
);


updatePlayer();

</script>

</body>
</html>
