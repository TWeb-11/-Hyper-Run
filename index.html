<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWEB-11</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#02040c;
    color:white;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at 50% 18%,#29488f,#101936 38%,#030611 80%);
}

/* Sterne */
.stars{
    position:absolute;
    inset:0;
    background-image:
    radial-gradient(circle,white 1px,transparent 2px),
    radial-gradient(circle,#65eaff 1px,transparent 2px);
    background-size:90px 90px,140px 140px;
    opacity:.5;
    animation:stars 10s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(90px)}
}

/* Mond */
.moon{
    position:absolute;
    width:105px;
    height:105px;
    right:9%;
    top:9%;
    border-radius:50%;
    background:#effcff;
    box-shadow:0 0 60px #7ddfff;
}

/* Stadt */
.city{
    position:absolute;
    bottom:28%;
    width:100%;
    height:25%;
}

.building{
    position:absolute;
    bottom:0;
    width:9%;
    min-width:50px;
    background:linear-gradient(#192b50,#080e1d);
    border:1px solid #31558c;
}

.building:after{
    content:"";
    position:absolute;
    inset:8px;
    background:repeating-linear-gradient(
        to bottom,
        rgba(80,225,255,.6) 0 4px,
        transparent 4px 17px
    );
    opacity:.35;
}

.b1{left:1%;height:80%}
.b2{left:12%;height:60%}
.b3{left:23%;height:100%}
.b4{left:34%;height:55%}
.b5{right:1%;height:90%}
.b6{right:12%;height:65%}
.b7{right:23%;height:80%}
.b8{right:34%;height:50%}

/* Straße */
#road{
    position:absolute;
    left:50%;
    bottom:-5%;
    transform:translateX(-50%);
    width:80%;
    height:78%;
    background:linear-gradient(90deg,#080d18,#202e46,#080d18);
    clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);
    border-left:3px solid #35ddff;
    border-right:3px solid #35ddff;
}

.lane{
    position:absolute;
    width:5px;
    height:100%;
    background:repeating-linear-gradient(
        to bottom,
        #64eaff 0 55px,
        transparent 55px 115px
    );
    animation:roadmove .5s linear infinite;
    opacity:.6;
}

.lane1{left:41%}
.lane2{left:59%}

@keyframes roadmove{
    from{background-position:0 0}
    to{background-position:0 115px}
}

/* Spieler */
#player{
    position:absolute;
    width:62px;
    height:95px;
    left:50%;
    bottom:14%;
    transform:translateX(-50%);
    z-index:50;
    transition:left .12s ease,bottom .2s ease;
}

.head{
    position:absolute;
    width:31px;
    height:31px;
    left:15px;
    top:0;
    border-radius:50%;
    background:linear-gradient(135deg,#ffe2bd,#ffbd7a);
    border:2px solid #111;
}

.body{
    position:absolute;
    width:42px;
    height:47px;
    left:10px;
    top:27px;
    border-radius:11px;
    background:linear-gradient(135deg,#00eaff,#4054ff);
    box-shadow:0 0 15px #00dfff;
}

.arm{
    position:absolute;
    width:9px;
    height:35px;
    top:32px;
    border-radius:8px;
    background:#ffca96;
}

.arm.left{
    left:2px;
    transform:rotate(18deg);
}

.arm.right{
    right:2px;
    transform:rotate(-18deg);
}

.leg{
    position:absolute;
    width:12px;
    height:32px;
    top:70px;
    border-radius:7px;
    background:#252d48;
}

.leg.left{
    left:13px;
    transform:rotate(12deg);
}

.leg.right{
    right:13px;
    transform:rotate(-12deg);
}

#player.jumping{
    bottom:31%;
}

/* Münzen */
.coin{
    position:absolute;
    width:31px;
    height:31px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        #fff8a0 0 18%,
        #ffd42a 19% 65%,
        #ff9900 66%
    );
    box-shadow:
    0 0 12px #ffd21c,
    0 0 28px rgba(255,195,0,.7);
    z-index:35;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    0%{transform:translateX(-50%) rotateY(0)}
    50%{transform:translateX(-50%) rotateY(180deg)}
    100%{transform:translateX(-50%) rotateY(360deg)}
}

/* Hindernisse */
.obstacle{
    position:absolute;
    width:60px;
    height:58px;
    border-radius:10px;
    background:linear-gradient(135deg,#ff416c,#a20d3d);
    border:2px solid #ff9eb4;
    box-shadow:0 0 20px rgba(255,40,100,.7);
    z-index:34;
}

.obstacle:before{
    content:"!";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-55%);
    font-size:35px;
    font-weight:bold;
}

/* HUD */
#hud{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    z-index:100;
}

.box{
    padding:9px 15px;
    border-radius:13px;
    background:rgba(4,9,24,.75);
    border:1px solid #4adfff;
    box-shadow:0 0 18px rgba(0,200,255,.2);
    font-weight:bold;
}

#score{color:#6eeaff}
#coins{color:#ffe35c}
#difficulty{color:#ff70b1}

/* Menü */
#menu{
    position:absolute;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(1,4,13,.8);
    backdrop-filter:blur(10px);
}

.menuBox{
    width:min(90%,520px);
    padding:40px 28px;
    text-align:center;
    border-radius:28px;
    background:linear-gradient(
        145deg,
        rgba(15,28,65,.96),
        rgba(5,10,25,.96)
    );
    border:1px solid #45ddff;
    box-shadow:0 0 40px rgba(0,210,255,.3);
}

.title{
    font-size:clamp(45px,11vw,80px);
    letter-spacing:5px;
    color:#67eaff;
    text-shadow:0 0 15px #00cfff;
    margin-bottom:12px;
}

.text{
    color:#c9d7ee;
    line-height:1.6;
    margin-bottom:28px;
}

button{
    border:none;
    border-radius:15px;
    padding:15px 34px;
    background:#59e8ff;
    color:#031019;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 25px rgba(0,220,255,.5);
}

button:active{
    transform:scale(.94);
}

.hidden{
    display:none!important;
}

/* Touch-Steuerung */
#touch{
    position:absolute;
    left:0;
    right:0;
    bottom:22px;
    display:none;
    justify-content:space-between;
    padding:0 22px;
    z-index:150;
}

.touchGroup{
    display:flex;
    gap:12px;
}

.touchButton{
    width:64px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid #62eaff;
    background:rgba(7,16,39,.85);
    color:white;
    font-size:26px;
    box-shadow:0 0 20px rgba(0,200,255,.25);
}

.touchButton:active{
    transform:scale(.88);
    background:#16445a;
}

/* Touch nur auf Handy/Tablet */
@media (hover:none) and (pointer:coarse){
    #touch{
        display:flex;
    }
}

/* Handy */
@media(max-width:500px){

    .touchButton{
        width:58px;
        height:58px;
        font-size:23px;
    }

    .box{
        padding:8px 10px;
        font-size:13px;
    }

    .moon{
        width:75px;
        height:75px;
    }
}
</style>
</head>

<body>

<div id="game">

<div class="stars"></div>
<div class="moon"></div>

<div class="city">
<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>
<div class="building b7"></div>
<div class="building b8"></div>
</div>

<div id="road">
<div class="lane lane1"></div>
<div class="lane lane2"></div>
</div>

<div id="player">
<div class="head"></div>
<div class="body"></div>
<div class="arm left"></div>
<div class="arm right"></div>
<div class="leg left"></div>
<div class="leg right"></div>
</div>

<div id="hud">
<div class="box">🏆 <span id="score">0</span></div>
<div class="box">🪙 <span id="coins">0</span></div>
<div class="box">⚡ <span id="difficulty">1</span></div>
</div>

<div id="touch">

<div class="touchGroup">
<div class="touchButton" id="left">◀</div>
<div class="touchButton" id="right">▶</div>
</div>

<div class="touchGroup">
<div class="touchButton" id="jump">▲</div>
</div>

</div>

<div id="menu">

<div class="menuBox">

<div class="title">TWEB-11</div>

<div class="text" id="menuText">
🏃 Laufe so weit du kannst!<br>
🪙 Sammle Münzen!<br>
🚧 Weiche Hindernissen aus!<br><br>
⚡ <b>Das Spiel wird immer schwieriger!</b>
</div>

<button id="start">
SPIEL STARTEN
</button>

</div>

</div>

</div>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");

const scoreText=document.getElementById("score");
const coinText=document.getElementById("coins");
const difficultyText=document.getElementById("difficulty");

const menu=document.getElementById("menu");
const menuText=document.getElementById("menuText");
const startButton=document.getElementById("start");

let running=false;
let lane=1;

let score=0;
let coins=0;

let speed=5;
let difficulty=1;

let spawnTimer=0;
let objects=[];

let jumping=false;
let lastTime=0;

let highscore=
Number(localStorage.getItem("tweb11Highscore")||0);

const lanes=[35,50,65];

function updatePlayer(){

    player.style.left=lanes[lane]+"%";

}

function startGame(){

    objects.forEach(o=>o.el.remove());
    objects=[];

    running=true;

    lane=1;
    score=0;
    coins=0;
    speed=5;
    difficulty=1;

    spawnTimer=20;
    jumping=false;

    scoreText.textContent="0";
    coinText.textContent="0";
    difficultyText.textContent="1";

    player.classList.remove("jumping");

    updatePlayer();

    menu.classList.add("hidden");

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);

}

function gameLoop(time){

    if(!running)return;

    const delta=
    Math.min((time-lastTime)/16.67,3);

    lastTime=time;

    score+=0.08*speed*delta;

    /* Schwierigkeit steigt alle 250 Punkte */

    const newDifficulty=
    Math.floor(score/250)+1;

    if(newDifficulty!==difficulty){

        difficulty=newDifficulty;

        difficultyText.textContent=difficulty;

    }

    /* Geschwindigkeit steigt */

    speed=
    5+(difficulty-1)*0.8;

    /* Hindernisse kommen immer schneller */

    spawnTimer-=delta;

    if(spawnTimer<=0){

        spawnObject();

        const minimum=
        Math.max(20,34-difficulty);

        const maximum=
        Math.max(minimum,70-difficulty*4);

        spawnTimer=
        minimum+
        Math.random()*(maximum-minimum);

    }

    moveObjects(delta);

    scoreText.textContent=
    Math.floor(score);

    requestAnimationFrame(gameLoop);

}

function spawnObject(){

    /*
    Mit höherer Schwierigkeit
    werden mehr Hindernisse erzeugt.
    */

    const obstacleChance=
    Math.min(
        .82,
        .55+difficulty*.025
    );

    const isCoin=
    Math.random()>obstacleChance;

    const element=
    document.createElement("div");

    element.className=
    isCoin?"coin":"obstacle";

    const randomLane=
    Math.floor(Math.random()*3);

    element.style.left=
    lanes[randomLane]+"%";

    element.style.transform=
    "translateX(-50%)";

    element.style.top="-90px";

    game.appendChild(element);

    objects.push({

        el:element,
        y:-90,
        lane:randomLane,
        coin:isCoin

    });

}

function moveObjects(delta){

    for(
        let i=objects.length-1;
        i>=0;
        i--
    ){

        const object=objects[i];

        object.y+=speed*delta;

        object.el.style.top=
        object.y+"px";

        if(checkCollision(object)){

            if(object.coin){

                coins++;
                score+=50;

                coinText.textContent=
                coins;

                object.el.remove();

                objects.splice(i,1);

                continue;

            }

            if(jumping){

                continue;

            }

            gameOver();

            return;

        }

        if(
            object.y>
            window.innerHeight+100
        ){

            object.el.remove();

            objects.splice(i,1);

        }

    }

}

function checkCollision(object){

    if(object.lane!==lane)
    return false;

    const p=
    player.getBoundingClientRect();

    const o=
    object.el.getBoundingClientRect();

    const padding=9;

    return(
        p.left+padding<o.right-padding &&
        p.right-padding>o.left+padding &&
        p.top+padding<o.bottom-padding &&
        p.bottom-padding>o.top+padding
    );

}

function gameOver(){

    running=false;

    const finalScore=
    Math.floor(score);

    if(finalScore>highscore){

        highscore=finalScore;

        localStorage.setItem(
            "tweb11Highscore",
            highscore
        );

    }

    menuText.innerHTML=
    "💥 <b>GAME OVER</b> 💥<br><br>"+
    "🏆 Score: <b>"+finalScore+"</b><br>"+
    "🪙 Münzen: <b>"+coins+"</b><br>"+
    "🏅 Highscore: <b>"+highscore+"</b><br><br>"+
    "⚡ Schwierigkeit: <b>"+difficulty+"</b>";

    startButton.textContent=
    "NOCHMAL SPIELEN";

    menu.classList.remove("hidden");

}

function moveLeft(){

    if(!running)return;

    if(lane>0){

        lane--;

        updatePlayer();

    }

}

function moveRight(){

    if(!running)return;

    if(lane<2){

        lane++;

        updatePlayer();

    }

}

function jump(){

    if(!running||jumping)return;

    jumping=true;

    player.classList.add("jumping");

    setTimeout(()=>{

        jumping=false;

        player.classList.remove("jumping");

    },650);

}

/* Tastatur */

document.addEventListener("keydown",e=>{

    if(
        e.key==="ArrowLeft"||
        e.key.toLowerCase()==="a"
    )
    moveLeft();

    if(
        e.key==="ArrowRight"||
        e.key.toLowerCase()==="d"
    )
    moveRight();

    if(
        e.key==="ArrowUp"||
        e.key===" "||
        e.key.toLowerCase()==="w"
    ){

        e.preventDefault();
        jump();

    }

    if(
        e.key==="Enter"&&!running
    )
    startGame();

});

/* Touch */

document.getElementById("left")
.addEventListener("pointerdown",e=>{
    e.preventDefault();
    moveLeft();
});

document.getElementById("right")
.addEventListener("pointerdown",e=>{
    e.preventDefault();
    moveRight();
});

document.getElementById("jump")
.addEventListener("pointerdown",e=>{
    e.preventDefault();
    jump();
});

startButton.addEventListener(
    "click",
    startGame
);

updatePlayer();

</script>

</body>
</html>
