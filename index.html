<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {
    overflow: hidden;
    background: #050816;
    font-family: Arial, sans-serif;
    color: white;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 25%, #263b7a 0%, #101936 35%, #050816 75%);
}

/* Himmel */
#sky {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 15% 20%, white 0 1px, transparent 2px),
        radial-gradient(circle at 80% 15%, white 0 1px, transparent 2px),
        radial-gradient(circle at 60% 35%, #8cf 0 1px, transparent 2px),
        radial-gradient(circle at 30% 45%, white 0 1px, transparent 2px);
    opacity: .6;
}

/* Mond */
#moon {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 45px #9fd8ff;
    top: 9%;
    right: 10%;
}

/* Boden */
#road {
    position: absolute;
    left: 50%;
    bottom: -10%;
    transform: translateX(-50%);
    width: 78%;
    height: 75%;
    background: linear-gradient(90deg, #101827, #27354c, #101827);
    clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%);
    border-left: 4px solid #46d9ff;
    border-right: 4px solid #46d9ff;
}

/* Fahrbahnlinien */
.laneLine {
    position: absolute;
    width: 7px;
    height: 100%;
    background: repeating-linear-gradient(
        to bottom,
        #72e8ff 0px,
        #72e8ff 60px,
        transparent 60px,
        transparent 120px
    );
    opacity: .55;
    animation: roadMove .45s linear infinite;
}

#line1 {
    left: 42%;
}

#line2 {
    left: 58%;
}

@keyframes roadMove {
    from {
        background-position-y: 0;
    }
    to {
        background-position-y: 120px;
    }
}

/* Stadt */
.building {
    position: absolute;
    bottom: 27%;
    width: 100px;
    background: linear-gradient(#17284b, #07101f);
    border: 2px solid #243e70;
    box-shadow: 0 0 15px rgba(55,180,255,.2);
}

.building::after {
    content: "";
    position: absolute;
    inset: 10px;
    background:
        repeating-linear-gradient(
            to bottom,
            #65dfff 0 5px,
            transparent 5px 18px
        );
    opacity: .3;
}

.b1 { left: 2%; height: 240px; }
.b2 { left: 13%; height: 170px; }
.b3 { right: 3%; height: 260px; }
.b4 { right: 14%; height: 180px; }

/* Spieler */
#player {
    position: absolute;
    width: 58px;
    height: 88px;
    left: 50%;
    bottom: 15%;
    transform: translateX(-50%);
    z-index: 20;
    transition: left .12s ease;
}

.head {
    position: absolute;
    width: 30px;
    height: 30px;
    background: #ffd4a3;
    border-radius: 50%;
    left: 14px;
    top: 0;
    border: 3px solid #111;
}

.body {
    position: absolute;
    width: 38px;
    height: 43px;
    background: linear-gradient(135deg, #00e5ff, #3155ff);
    border-radius: 10px;
    left: 10px;
    top: 28px;
    box-shadow: 0 0 18px #00d9ff;
}

.leg {
    position: absolute;
    width: 12px;
    height: 30px;
    background: #202840;
    top: 67px;
    border-radius: 5px;
}

.leg.left {
    left: 12px;
    transform: rotate(12deg);
}

.leg.right {
    right: 12px;
    transform: rotate(-12deg);
}

#player.jumping {
    bottom: 31%;
}

/* Münzen */
.coin {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 5px solid #ffe45e;
    background: #ffb300;
    box-shadow: 0 0 20px #ffc400;
    z-index: 15;
}

/* Hindernisse */
.obstacle {
    position: absolute;
    width: 58px;
    height: 55px;
    background: linear-gradient(135deg, #ff416c, #9d1640);
    border: 3px solid #ff9bb1;
    border-radius: 9px;
    box-shadow: 0 0 20px rgba(255,40,100,.7);
    z-index: 14;
}

.obstacle::before {
    content: "!";
    position: absolute;
    font-size: 35px;
    font-weight: bold;
    left: 17px;
    top: 5px;
}

/* UI */
#topUI {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    z-index: 100;
    font-weight: bold;
}

.panel {
    background: rgba(5,10,25,.7);
    border: 1px solid #39d9ff;
    border-radius: 14px;
    padding: 10px 16px;
    box-shadow: 0 0 18px rgba(0,200,255,.25);
    backdrop-filter: blur(8px);
}

#score {
    color: #70eaff;
}

#coins {
    color: #ffe45e;
}

/* Start / Game Over */
#menu {
    position: absolute;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(2,5,15,.72);
    backdrop-filter: blur(8px);
}

.menuBox {
    width: min(90%, 500px);
    padding: 35px;
    border: 1px solid #42ddff;
    border-radius: 25px;
    background: rgba(8,15,35,.92);
    box-shadow: 0 0 50px rgba(0,200,255,.25);
}

h1 {
    font-size: clamp(42px, 9vw, 76px);
    letter-spacing: 5px;
    color: #6beaff;
    text-shadow: 0 0 20px #00cfff;
}

.subtitle {
    margin: 10px 0 25px;
    color: #b7c8e8;
}

button {
    border: none;
    border-radius: 14px;
    padding: 15px 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    color: #03101b;
    background: #5be7ff;
    box-shadow: 0 0 25px rgba(70,220,255,.5);
    transition: .2s;
}

button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 35px rgba(70,220,255,.8);
}

.hidden {
    display: none !important;
}

/* Handy-Steuerung */
#mobileControls {
    position: absolute;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 150;
}

.controlGroup {
    display: flex;
    gap: 12px;
}

.control {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 1px solid #53ddff;
    background: rgba(10,20,45,.8);
    color: white;
    font-size: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
}

@media (min-width: 800px) {
    #mobileControls {
        display: none;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="sky"></div>
    <div id="moon"></div>

    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>

    <div id="road">
        <div class="laneLine" id="line1"></div>
        <div class="laneLine" id="line2"></div>
    </div>

    <div id="player">
        <div class="head"></div>
        <div class="body"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
    </div>

    <div id="topUI">
        <div class="panel">
            SCORE: <span id="score">0</span>
        </div>

        <div class="panel">
            🪙 <span id="coins">0</span>
        </div>
    </div>

    <div id="mobileControls">

        <div class="controlGroup">
            <div class="control" id="leftBtn">◀</div>
            <div class="control" id="rightBtn">▶</div>
        </div>

        <div class="controlGroup">
            <div class="control" id="jumpBtn">▲</div>
        </div>

    </div>

    <div id="menu">
        <div class="menuBox">

            <h1 id="menuTitle">NEON RUNNER</h1>

            <div class="subtitle" id="menuText">
                Laufe so weit du kannst!<br>
                Weiche Hindernissen aus und sammle Münzen.
            </div>

            <button id="startBtn">
                SPIEL STARTEN
            </button>

        </div>
    </div>

</div>

<script>
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const menu = document.getElementById("menu");
const menuTitle = document.getElementById("menuTitle");
const menuText = document.getElementById("menuText");
const startBtn = document.getElementById("startBtn");

let running = false;
let lane = 1;
let score = 0;
let coins = 0;
let speed = 5;
let objects = [];
let spawnTimer = 0;
let lastTime = 0;
let jumping = false;
let highscore = Number(localStorage.getItem("neonHighscore") || 0);

const lanes = [35, 50, 65];

function updatePlayer() {
    player.style.left = lanes[lane] + "%";
}

function startGame() {

    objects.forEach(obj => obj.el.remove());
    objects = [];

    score = 0;
    coins = 0;
    speed = 5;
    lane = 1;
    jumping = false;

    scoreText.textContent = "0";
    coinsText.textContent = "0";

    player.classList.remove("jumping");
    updatePlayer();

    menu.classList.add("hidden");

    running = true;
    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}

function gameLoop(time) {

    if (!running) return;

    const delta = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;

    score += 0.08 * delta * speed;

    speed += 0.0008 * delta;

    scoreText.textContent = Math.floor(score);

    spawnTimer -= delta;

    if (spawnTimer <= 0) {

        spawnObject();

        spawnTimer = Math.max(
            28,
            75 - speed * 4
        );
    }

    moveObjects(delta);

    requestAnimationFrame(gameLoop);
}

function spawnObject() {

    const isCoin = Math.random() < 0.45;

    const obj = document.createElement("div");

    obj.className = isCoin ? "coin" : "obstacle";

    const randomLane = Math.floor(Math.random() * 3);

    obj.dataset.lane = randomLane;

    obj.style.left = lanes[randomLane] + "%";
    obj.style.transform = "translateX(-50%)";
    obj.style.top = "-80px";

    document.getElementById("game").appendChild(obj);

    objects.push({
        el: obj,
        y: -80,
        lane: randomLane,
        coin: isCoin
    });
}

function moveObjects(delta) {

    for (let i = objects.length - 1; i >= 0; i--) {

        const obj = objects[i];

        obj.y += speed * delta;

        obj.el.style.top = obj.y + "px";

        if (checkCollision(obj)) {

            if (obj.coin) {

                coins++;
                coinsText.textContent = coins;

                score += 50;

                obj.el.remove();
                objects.splice(i, 1);

                continue;

            } else {

                gameOver();
                return;
            }
        }

        if (obj.y > window.innerHeight + 100) {

            obj.el.remove();
            objects.splice(i, 1);
        }
    }
}

function checkCollision(obj) {

    if (obj.lane !== lane) return false;

    const playerRect = player.getBoundingClientRect();
    const objRect = obj.el.getBoundingClientRect();

    if (
        playerRect.left < objRect.right &&
        playerRect.right > objRect.left &&
        playerRect.top < objRect.bottom &&
        playerRect.bottom > objRect.top
    ) {

        if (jumping && !obj.coin) {
            return false;
        }

        return true;
    }

    return false;
}

function gameOver() {

    running = false;

    const finalScore = Math.floor(score);

    if (finalScore > highscore) {

        highscore = finalScore;

        localStorage.setItem(
            "neonHighscore",
            highscore
        );
    }

    menuTitle.textContent = "GAME OVER";

    menuText.innerHTML =
        "Dein Score: <b>" + finalScore +
        "</b><br><br>" +
        "🏆 Highscore: <b>" + highscore +
        "</b><br>" +
        "🪙 Münzen: <b>" + coins + "</b>";

    startBtn.textContent = "NOCHMAL SPIELEN";

    menu.classList.remove("hidden");
}

function moveLeft() {

    if (!running) return;

    if (lane > 0) {

        lane--;

        updatePlayer();
    }
}

function moveRight() {

    if (!running) return;

    if (lane < 2) {

        lane++;

        updatePlayer();
    }
}

function jump() {

    if (!running || jumping) return;

    jumping = true;

    player.classList.add("jumping");

    setTimeout(() => {

        jumping = false;

        player.classList.remove("jumping");

    }, 650);
}

/* Tastatur */

document.addEventListener("keydown", event => {

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        moveLeft();
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        moveRight();
    }

    if (
        event.key === "ArrowUp" ||
        event.key === " " ||
        event.key.toLowerCase() === "w"
    ) {
        event.preventDefault();
        jump();
    }

    if (event.key === "Enter" && !running) {
        startGame();
    }
});

/* Touch */

document.getElementById("leftBtn")
    .addEventListener("click", moveLeft);

document.getElementById("rightBtn")
    .addEventListener("click", moveRight);

document.getElementById("jumpBtn")
    .addEventListener("click", jump);

startBtn.addEventListener("click", startGame);

updatePlayer();
</script>

</body>
</html>
